<!-- login.html -->
{% extends "base.html" %}
{% block title %}Log in · Study Spot{% endblock %}
{% block content %}
<div class="auth-wrap">
  <form method="post" class="card auth-card">
    <h1>Log in</h1>
    <p class="muted">Save favorites, book seats, and track your study time.</p>
    <input type="hidden" name="next" value="{{ next }}" />
    <div class="field"><label for="email">Email</label><input type="email" id="email" name="email" required autofocus /></div>
    <div class="field"><label for="password">Password</label><input type="password" id="password" name="password" required /></div>
    <button class="btn btn-primary full-width" type="submit">Log in</button>
    <p class="muted small">New here? <a href="{{ url_for('signup') }}">Create an account</a></p>
  </form>
</div>
{% endblock %}
