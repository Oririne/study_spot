<div class="spot-card" data-id="{{ spot.id }}">
  <div class="spot-icon"><i class="fas {{ spot.icon }}"></i></div>
  <div class="spot-info">
    <h4>{{ spot.name }}</h4>
    <div class="distance"><i class="fas fa-walking"></i> {{ spot.walk }} · {{ 'open now' if spot.open else 'closed' }}</div>
    <div class="stars">
      {% for i in range(5) %}
        {% if i < spot.rating|int %}<i class="fas fa-star"></i>
        {% elif (spot.rating - i) >= 0.5 %}<i class="fas fa-star-half-alt"></i>
        {% else %}<i class="far fa-star"></i>{% endif %}
      {% endfor %}
      {{ spot.rating }}
    </div>
  </div>
  <button class="fav-btn {{ 'favorited' if spot.id in favs }}" data-id="{{ spot.id }}" aria-label="Save favorite">
    <i class="{{ 'fas' if spot.id in favs else 'far' }} fa-heart"></i>
  </button>
</div>
